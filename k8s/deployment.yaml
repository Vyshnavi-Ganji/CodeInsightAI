apiVersion: apps/v1
kind: Deployment
metadata:
  name: asda
  labels:
    app: asda
spec:
  replicas: 1
  selector:
    matchLabels:
      app: asda
  template:
    metadata:
      labels:
        app: asda
    spec:
      containers:
        - name: asda
          image: saivyshnavi06/asda:latest
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 5000
          volumeMounts:
            - name: asda-data
              mountPath: /data
          env:
            - name: SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: asda-secrets
                  key: secret-key
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: asda-secrets
                  key: database-url
            - name: SESSION_COOKIE_SECURE
              value: "false"
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 20
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 750m
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            capabilities:
              drop: ["ALL"]
      volumes:
        - name: asda-data
          persistentVolumeClaim:
            claimName: asda-data
      securityContext:
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
